version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: salesfortis-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesfortis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesfortis_password}
      POSTGRES_DB: ${POSTGRES_DB:-salesfortis}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesfortis -d salesfortis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: salesfortis-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: salesfortis-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-salesfortis}:${POSTGRES_PASSWORD:-salesfortis_password}@postgres:5432/${POSTGRES_DB:-salesfortis}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-salesfortis-local-dev-secret-override-in-prod}
      PORT: 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: salesfortis-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://salesfortis:salesfortis_password@postgres:5432/salesfortis
      REDIS_URL: redis://redis:6379/0

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: salesfortis-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5000:80"
      - "5001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

