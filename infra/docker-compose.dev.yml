version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: salesfortis-postgres
    restart: always
    environment:
      POSTGRES_USER: salesfortis
      POSTGRES_PASSWORD: salesfortis_password
      POSTGRES_DB: salesfortis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesfortis -d salesfortis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: salesfortis-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: salesfortis-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://salesfortis:salesfortis_password@postgres:5432/salesfortis
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: salesfortis-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://salesfortis:salesfortis_password@postgres:5432/salesfortis
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:

